# Checks run on every `git commit` (install once with `pre-commit install`).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # keep equal to the ruff version in requirements.txt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # Data and models live in data/ (ignored by git); a large file is a mistake.
      - id: check-added-large-files
        args: [--maxkb=1000]

  # Blocks any commit containing the ENTSO-E key (the project's only secret),
  # notebook outputs included. Pure Python (pre-commit's pygrep): no compiled
  # binary that Windows Smart App Control could block. Same pattern as the
  # entsoe-api-key rule of .gitleaks.toml: keep the two equal. gitleaks itself,
  # with its default rules, is run on the files and the history before each push.
  - repo: local
    hooks:
      - id: entsoe-api-key
        name: Detect the ENTSO-E key
        language: pygrep
        entry: '(?i)(?:securitytoken|entsoe[_-]?api[_-]?key)["'']?\s*[:=]\s*["'']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
        types: [text]
