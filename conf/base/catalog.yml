# ==================================================
# DATA CATALOG — Energy Market Analyzer
# ==================================================
# Tables are stored in Parquet: it keeps the dtypes and the
# UTC time zone that CSV loses on reload (decision D10).
# Reports are JSON. Each pipeline adds its datasets.
# The ENTSO-E key is not declared here: the hook in
# settings.py adds it as `entsoe_api_key`.
# ==================================================


# === 01_raw: data as published by each source ===

entsoe_prices_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/entsoe/prices.parquet

entsoe_load_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/entsoe/load.parquet

entsoe_load_forecast_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/entsoe/load_forecast.parquet

entsoe_generation_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/entsoe/generation.parquet

entsoe_flows_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/entsoe/flows.parquet

ttf_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/yahoo/ttf.parquet

eua_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/eex/eua.parquet

weather_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/openmeteo/weather.parquet


# === 03_primary: hourly master table ===

master:
  type: pandas.ParquetDataset
  filepath: data/03_primary/master.parquet


# === 04_feature: one feature table per strategy ===

# Model A: one row per delivered hour (UTC), features known at 11:00 the day before.
features_model_a:
  type: pandas.ParquetDataset
  filepath: data/04_feature/features_model_a.parquet

# Model B: one row per (decision_day, horizon_days), calendar days in Brussels.
features_model_b:
  type: pandas.ParquetDataset
  filepath: data/04_feature/features_model_b.parquet

# Model C: one row per hour (UTC), causal, for regimes and anomalies.
features_model_c:
  type: pandas.ParquetDataset
  filepath: data/04_feature/features_model_c.parquet

# Regimes: one row per calendar day in Brussels. Filtered regime (past only)
# for predictions and anomalies; smoothed regime for retrospective analysis.
regimes:
  type: pandas.ParquetDataset
  filepath: data/04_feature/regimes.parquet


# === 07_model_output ===

# Anomalies: one row per hour (UTC). Score of the Isolation Forest of the hour's
# filtered regime, refitted each month on the past; flag, driver and event.
# Retrospective analysis (model C) only, never a prediction input.
anomalies:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/anomalies.parquet

# One row per anomaly event: anomalous hours close in time, peak hour and driver.
anomaly_events:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/anomaly_events.parquet

# Model A: one row per predicted hour (UTC), from January 2020. Every model's
# prediction (each refitted monthly on the past), the selected variant and its
# raw and calibrated 80 % interval.
predictions_model_a:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/predictions_model_a.parquet

# Model B: one row per (decision_day, horizon_days), same columns for the daily mean price.
predictions_model_b:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/predictions_model_b.parquet

# Alerts: one row per predicted hour of model A. Level against the regime's
# thresholds, its probability and confidence, rank of the hour in its day.
alerts:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/alerts.parquet


# === 08_reporting ===

data_quality_report:
  type: json.JSONDataset
  filepath: data/08_reporting/data_quality_report.json

features_report:
  type: json.JSONDataset
  filepath: data/08_reporting/features_report.json

regime_report:
  type: json.JSONDataset
  filepath: data/08_reporting/regime_report.json

anomaly_report:
  type: json.JSONDataset
  filepath: data/08_reporting/anomaly_report.json

prediction_report:
  type: json.JSONDataset
  filepath: data/08_reporting/prediction_report.json
