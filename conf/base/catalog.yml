# ==================================================
# DATA CATALOG — Energy Market Analyzer
# ==================================================
# Each dataset is declared with its type, path, and
# options.
#
# Paths use ${globals:country} for multi-country support
# (substituted from globals.yml).
# ==================================================


# === 01_raw : Raw API data ===

entsoe_prices_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/entsoe/${globals:country}/prices.csv
  save_args:
    index: true
  load_args:
    parse_dates: true
    index_col: 0

entsoe_generation_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/entsoe/${globals:country}/generation.csv
  save_args:
    index: true
  load_args:
    parse_dates: true
    index_col: 0

entsoe_load_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/entsoe/${globals:country}/load.csv
  save_args:
    index: true
  load_args:
    parse_dates: true
    index_col: 0

entsoe_flows_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/entsoe/${globals:country}/flows.csv
  save_args:
    index: true
  load_args:
    parse_dates: true
    index_col: 0

yfinance_ttf_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/yfinance/ttf.csv
  save_args:
    index: true
  load_args:
    parse_dates: true
    index_col: 0

yfinance_carbon_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/yfinance/carbon.csv
  save_args:
    index: true
  load_args:
    parse_dates: true
    index_col: 0

openmeteo_weather_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/openmeteo/${globals:country}/weather.csv
  save_args:
    index: true
  load_args:
    parse_dates: true
    index_col: 0


# === 03_primary : Unified DataFrame ===

master_dataframe:
  type: pandas.ParquetDataset
  filepath: data/03_primary/master.parquet
  save_args:
    engine: pyarrow
  load_args:
    engine: pyarrow


# === 04_feature : Enriched DataFrame ===

master_enriched:
  type: pandas.ParquetDataset
  filepath: data/04_feature/master_enriched.parquet
  save_args:
    engine: pyarrow
  load_args:
    engine: pyarrow


