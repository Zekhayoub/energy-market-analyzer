# ==================================================
# PARAMETERS — Energy Market Analyzer
# ==================================================
# One top-level section per pipeline, validated at startup
# by the pydantic models in settings.py (unknown keys are
# rejected). Each pipeline adds its section in its commit.
# ==================================================


# --- Ingestion ---
ingestion:
  country: ${globals:country}
  market_timezone: ${globals:market_timezone}

  # Delivery days, both included, in market time. Window common to all
  # sources: Yahoo's TTF history starts at the end of 2017 (decision D8).
  start_date: "2018-01-01"
  end_date: "2026-09-30"

  # First delivery day of the 15-minute day-ahead market (SDAC go-live).
  # From this day on, an hourly price needs its 4 quarter-hours (decision D2).
  quarter_hour_prices_from: "2025-10-01"

  # Neighbouring ENTSO-E zones -> first day of commercial operation of the
  # interconnector. null = in service before start_date. Before that day
  # the flow is 0 by construction (decision D11).
  borders:
    FR: null
    NL: null
    DE_LU: "2020-11-18"  # ALEGrO
    GB: "2019-01-31"     # Nemo Link

  # ENTSO-E production types -> master columns (MW). A type not published
  # during a whole year is 0 MW that year. Types not listed are dropped
  # (and logged).
  generation_columns:
    Biomass: gen_biomass_mw
    Energy storage: gen_storage_mw
    Fossil Gas: gen_gas_mw
    Fossil Hard coal: gen_coal_mw
    Fossil Oil: gen_oil_mw
    Hydro Pumped Storage: gen_hydro_pumped_mw
    Hydro Run-of-river and pondage: gen_hydro_river_mw  # ENTSO-E spelling
    Nuclear: gen_nuclear_mw
    Other: gen_other_mw
    Other renewable: gen_other_renewable_mw
    Solar: gen_solar_mw
    Waste: gen_waste_mw
    Wind Offshore: gen_wind_offshore_mw
    Wind Onshore: gen_wind_onshore_mw

  # Units for which Elia publishes no value when they produce nothing: a missing
  # hour is 0 MW when the generation document exists (decision D12). Evidence
  # from run 1: offshore wind is missing at calm (3.4 m/s mean wind vs 6.9) and
  # never published as 0; pumped storage is missing in cheap hours (75 vs
  # 111 EUR/MWh), when it pumps or waits.
  zero_when_unpublished:
    - gen_wind_offshore_mw
    - gen_hydro_pumped_mw

  # Gas: front-month Dutch TTF future on Yahoo Finance (EUR/MWh, decision D4).
  ttf_ticker: "TTF=F"

  # Carbon: clearing price of the EEX primary auctions of general EU
  # allowances (EUR/t, decision D4). Years up to eua_archive_last_year come
  # from the archive, later years from one workbook per year.
  eua_contract: "T3PA"
  eua_archive_url: "https://www.eex.com/fileadmin/EEX/Downloads/Markets/Environmentals/EUA_Emission_Spot_Primary_Market_Auction_Report/Archive_Reports/emission-spot-primary-market-auction-report-2012-2025-data.zip"
  eua_archive_last_year: 2025
  eua_yearly_url: "https://public.eex-group.com/eex/eua-auction-report/emission-spot-primary-market-auction-report-{year}-data.xlsx"

  # A daily history may start (or end) at most this many days after
  # start_date (before end_date). Beyond that, ingestion stops.
  max_history_gap_days: 7

  # Observed weather (Open-Meteo archive). ERA5 keeps one model over the
  # whole period. Brussels: one point, documented as a limit.
  weather:
    latitude: 50.85
    longitude: 4.35
    model: "era5"
    archive_url: "https://archive-api.open-meteo.com/v1/archive"

  # Length of one ENTSO-E request, in months. Must stay under 12: entsoe-py
  # pads price requests by a day and loses the hour where it splits a request
  # longer than a year.
  entsoe_window_months: 6

  # Network calls: attempts per request, first wait (doubled at each new
  # attempt) and timeout of one request.
  retry_max_attempts: 3
  retry_backoff_seconds: 5
  http_timeout_seconds: 120


# --- Features ---
# One table per strategy (decisions.md, section 6). Models A and B only see
# what is known at 11:00 Brussels on the decision day; table C is hourly and
# causal (the value of hour t only uses data up to t).
features:
  market_timezone: ${globals:market_timezone}
  holdout_start: ${globals:holdout_start}

  # Public holidays of this country (`holidays` package code) mark the
  # calendar of the predicted day.
  holiday_country: "BE"

  # Master columns used for the ratios to load. Ratios are taken to the load,
  # not to total generation: the total depends on irregularly published types
  # ("Other" almost empty in 2021-2022, moved to biomass).
  gas_column: gen_gas_mw
  nuclear_column: gen_nuclear_mw
  wind_solar_columns:
    - gen_wind_onshore_mw
    - gen_wind_offshore_mw
    - gen_solar_mw

  # Gas and carbon: last price strictly before the reference day, used at
  # most this many days after its session, NaN beyond. Gas: weekends and
  # holidays. Carbon: longest EEX auction pause is 46 days (January 2021,
  # start of phase 4).
  ttf_max_age_days: 7
  eua_max_age_days: 50

  # Clean spark spread = price - heat_rate x TTF - heat_rate x emission
  # factor x EUA (decision D7). Heat rate 2.0 = 50 % efficiency; natural gas
  # emits 0.202 tCO2 per MWh of gas burnt.
  heat_rate: 2.0
  emission_factor_t_per_mwh_gas: 0.202

  # Table C: standard deviation of the hourly price changes over this window.
  volatility_window_hours: 24

  # Model B: days between the decision day and the predicted day.
  multi_day_horizons: [2, 3, 4]


# --- Regime ---
# Gaussian HMM on one observation per day (mean price, volatility, mean clean
# spark spread), all known the day before. Filtered regime: monthly refit on
# the past, forward algorithm (models A and B, alerts, Isolation Forest).
# Smoothed regime: whole period, retrospective analysis only (decision D6).
regime:
  market_timezone: ${globals:market_timezone}
  holdout_start: ${globals:holdout_start}

  # One name per state, in order of increasing volatility; their number is the
  # number of states. Changing it changes every later pipeline: decide it on
  # the "choices_before_holdout" section of regime_report.json only.
  regime_names: [calm, volatile, crisis]

  # Numbers of states whose BIC is reported (fitted before holdout_start).
  bic_candidate_states: [2, 3, 4, 5]

  # Months of data before the first filtered regime: with data from January
  # 2018, the first refit is on 1 January 2019.
  min_train_months: 12

  # "full" keeps the correlations between the three observations; min_covar
  # (on standardized inputs) keeps every covariance matrix invertible.
  covariance_type: full
  min_covar: 0.001

  # EM: starts per fit (the previous month's model is one of them), maximum
  # iterations, and the gain of log-likelihood under which EM has converged.
  n_init: 10
  n_iter: 500
  tol: 0.001

  # Seed of the first random start (start k uses seed + k). The stability
  # check refits the development model from the other seeds.
  random_state: 42
  stability_seeds: [123, 456]


# --- Anomaly ---
# Isolation Forest per filtered regime, refitted on the first day of each month
# on the previous hours of that regime only (decisions D21 to D24). An hour is
# anomalous when it is unusual for its regime: 200 EUR/MWh is ordinary in a
# crisis and rare when the market is calm. Retrospective analysis (model C):
# never an input of models A and B.
anomaly:
  market_timezone: ${globals:market_timezone}
  holdout_start: ${globals:holdout_start}
  # Same names, in the same order, as the regime section (label 0 = calm).
  regime_names: ${regime.regime_names}

  # Table C columns the Isolation Forests see. No calendar column (hour 23 would
  # be far from hour 0; the residual load gives the context of the hour), no fuel
  # level (daily steps with a trend: they enter through the spread), no 24-hour
  # volatility (after one spike it stays high, and flagged, for a whole day).
  # The order is the order of preference when two drivers are equally rare.
  features:
    - price_eur_mwh
    - price_change_1h
    - clean_spark_spread
    - residual_load_mw
    - net_import_total

  # Months of filtered regimes before the first scored month (one full seasonal
  # cycle): the first filtered regime is on 1 January 2019, the first scored
  # month is January 2020.
  min_train_months: 12

  # A regime with fewer training hours (30 days) is scored by the closest regime
  # in volatility order that has enough, the more volatile one on a tie.
  min_training_hours: 720

  # Training hours of each refit: every past hour (null) or those of the last
  # training_window_months months only. Rule of run 4 (decisions.md, section
  # 12): the candidates are compared on the development period, and the window
  # with the lower mean calibration error is kept.
  training_window_months: 24
  window_candidates_months: [null, 24]

  # Business choice: share of each regime's training hours above the threshold
  # (5 % = about 440 hours a year for the procurement team). The report gives
  # the realized share and the events per week at each level of the list.
  contamination: 0.05
  contamination_levels: [0.01, 0.02, 0.05, 0.10]

  # Isolation Forest of Liu et al. (2008): trees, and hours drawn per tree, as
  # in the paper. The stability check refits the development period with the
  # second seed; the seed is never chosen from the results.
  n_estimators: 200
  max_samples: 256
  random_state: 42
  stability_seed: 123

  # Two anomalous hours separated by at most this many normal hours belong to
  # the same event (a price shock lasts 3 to 6 hours). An unscored hour ends an
  # event, and so does holdout_start.
  event_max_gap_hours: 4

  # Strongest events listed in the report, per period.
  top_events: 10
