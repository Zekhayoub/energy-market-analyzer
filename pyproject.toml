[project]
name = "energy-market-analyzer"
version = "0.1.0"
description = "Energy market regime detection, price prediction, and alert system for Belgian electricity"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
energy-market-analyzer = "energy_market_analyzer.__main__:main"

[tool.kedro]
package_name = "energy_market_analyzer"
project_name = "energy-market-analyzer"
kedro_init_version = "0.19.1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "S101",   # no assert in production code
    "T20",    # no print
    "BLE",    # no blind `except Exception`
    "PD002",  # no inplace=True
    "DTZ",    # no datetime without time zone
    "PT",     # pytest style, including pytest.raises(..., match=...)
    "TID251", # banned imports (see below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src".msg = "Import from energy_market_analyzer, never from src."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
