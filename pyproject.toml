[project]
name = "energy-market-analyzer"
version = "0.1.0"
description = "Energy market regime detection, price prediction, and alert system for Belgian electricity"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
energy-market-analyzer = "energy_market_analyzer.__main__:main"

[tool.kedro]
package_name = "energy_market_analyzer"
project_name = "energy-market-analyzer"
kedro_init_version = "0.19.1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require real Belgian data (deselect with '-m not integration')",
]
addopts = "-v --tb=short"
